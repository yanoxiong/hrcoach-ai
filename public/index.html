<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HRCoach AI</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="toast" class="toast hidden"></div>

<section id="authView" class="auth-page">
  <div class="auth-wrap">
    <div class="brand-block">
      <div class="logo">HC</div>
      <div><h1>HRCoach AI</h1><p>AI coaching for frontline managers.</p></div>
    </div>

    <div class="auth-card">
      <div id="normalAuth">
        <div class="tabs">
          <button id="loginTab" class="tab active">Sign in</button>
          <button id="registerTab" class="tab">Create account</button>
        </div>

        <form id="loginForm" class="form">
          <label>Email<input id="loginEmail" type="email" required></label>
          <label>Password<input id="loginPassword" type="password" required></label>
          <button class="primary" type="submit">Sign in</button>
          <button id="forgotBtn" class="ghost" type="button">Forgot password?</button>
        </form>

        <form id="registerForm" class="form hidden">
          <label>Your name<input id="registerName" required></label>
          <label>Business name<input id="registerCompany" required></label>
          <label>Email<input id="registerEmail" type="email" required></label>
          <label>Password<input id="registerPassword" type="password" minlength="8" required></label>
          <button class="primary" type="submit">Create HRCoach account</button>
        </form>

        <form id="forgotForm" class="form hidden">
          <h3 style="margin:0">Reset password</h3>
          <label>Email<input id="forgotEmail" type="email" required></label>
          <button class="primary" type="submit">Send reset link</button>
          <button id="backToLogin" class="ghost" type="button">Back</button>
        </form>
      </div>

      <div id="verifyPanel" class="form hidden">
        <h3 style="margin:0">Verify your email</h3>
        <p id="verifyMessage" class="fine"></p>
        <button id="verifyBackBtn" class="primary" type="button">Back to sign in</button>
      </div>

      <form id="resetForm" class="form hidden">
        <h3 style="margin:0">Choose a new password</h3>
        <label>New password<input id="resetPassword" type="password" minlength="8" required></label>
        <button class="primary" type="submit">Update password</button>
      </form>

      <div id="messagePanel" class="form hidden">
        <h3 id="messageTitle" style="margin:0"></h3>
        <p id="messageText" class="fine"></p>
        <button id="messageBackBtn" class="primary" type="button">Back to sign in</button>
      </div>
    </div>

    <p class="fine">Use fictional employee data until production privacy and security work is complete.</p>
  </div>
</section>

<div id="appView" class="shell hidden">
  <header class="topbar">
    <div class="brand-mini">
      <div class="logo small">HC</div>
      <div><strong>HRCoach AI</strong><span id="companyName">Company</span></div>
    </div>
    <div class="top-actions">
      <span id="modeBadge" class="badge">Checking AI…</span>
      <button id="logoutBtn" class="ghost">Sign out</button>
    </div>
  </header>

  <main id="main"></main>

  <nav class="bottom-nav">
    <button data-route="home" class="nav active">Home</button>
    <button data-route="employees" class="nav">Employees</button>
    <button data-route="tools" class="nav">Tools</button>
    <button data-route="history" class="nav">History</button>
    <button data-route="account" class="nav">Account</button>
   </nav>
</div>

<footer style="text-align:center; padding:24px 12px; font-size:14px;">
  <a href="/privacy.html">Privacy Policy</a>
  &nbsp;|&nbsp;
  <a href="/terms.html">Terms of Service</a>
  &nbsp;|&nbsp;
  <a href="/ai-disclaimer.html">AI & HR Disclaimer</a>
</footer>

<script src="/app.js"></script>
</body>
</html>
